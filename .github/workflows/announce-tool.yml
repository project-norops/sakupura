name: Announce released tool on X

on:
  workflow_dispatch:
    inputs:
      slug:
        description: "Released tool slug (example: dynamic-pricing)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-state-writes
  cancel-in-progress: false

jobs:
  announce:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Publish approved announcement
        run: npm run release:x -- --slug "$TOOL_SLUG" --publish
        env:
          TOOL_SLUG: ${{ inputs.slug }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_KEY_SECRET: ${{ secrets.X_API_KEY_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
      - name: Record successful announcement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/portal/src/data/tools.json
          git diff --cached --quiet || git commit -m "chore: record X announcement"
          git push
